<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Al escanear el QR · Árboles Parlantes · Maqueta 2027</title>
  <link rel="icon" href="img/favicon.ico">
  <link rel="stylesheet" href="css/maqueta.css">
  <link rel="stylesheet" href="css/paginas-intro.css">
</head>
<body>
  <main id="contenido">
    <div class="contenedor">

      <p class="antetitulo">Página de acceso del QR</p>
      <h1>Lo que se ve al escanear el QR</h1>
      <p class="acceso-intro">Al escanear el código del panel con el celular se abre esta pantalla, sin registro ni descarga. Desde aquí la persona sigue la cuenta del árbol o entra a su ficha en la plataforma.</p>

      <div class="telefono">
        <section class="pantalla" id="pantalla" aria-label="Pantalla del celular"></section>
      </div>

    </div>
  </main>

  <script src="js/datos.js"></script>
  <script src="js/clima.js"></script>
  <script src="js/comun.js"></script>
  <script>
    (function () {
      var esc = AP.escapar;
      var a = AP.arbolActual();
      var id = encodeURIComponent(a.id);

      document.title = "Al escanear el QR " + AP.del_(a) + " · Árboles Parlantes · Maqueta 2027";

      var foto = a.foto
        ? '<img class="foto-arbol" src="' + esc(a.foto) + '" alt="' + esc(a.fotoAlt) + '">' + AP.creditoFoto(a)
        : '<div class="placeholder-foto foto-arbol" role="img" aria-label="Foto ' + esc(AP.del_(a)) + ' pendiente">Foto ' + esc(AP.del_(a)) + ' – pendiente</div>';

      var otros = window.ARBOLES.filter(function (x) { return x.id !== a.id; }).map(function (x) {
        return '<li><a href="acceso.html?arbol=' + encodeURIComponent(x.id) + '">' + esc(x.comun) + '</a></li>';
      }).join("");

      document.getElementById("pantalla").innerHTML =
        foto +
        '<div class="pantalla-cuerpo">' +
          '<h2>' + esc(a.comun) + '</h2>' +
          '<p class="handle handle-ejemplo">' + esc(a.handle) + '</p>' +
          '<p class="especie"><em>' + esc(a.especie) + '</em> · ' + esc(a.lugar) + '</p>' +
          '<p class="bio">' + esc(a.bio) + '</p>' +
          '<ul class="acciones">' +
            '<li><a class="boton bloque" href="redes.html?arbol=' + id + '#instagram">' + ICONOS.foto + 'Seguir en Instagram</a></li>' +
            '<li><a class="boton bloque" href="redes.html?arbol=' + id + '#x">' + ICONOS.mensaje + 'Seguir en X</a></li>' +
            '<li><a class="boton bloque secundario" href="arbol.html?arbol=' + id + '">' + ICONOS.ficha + 'Ver mi ficha</a></li>' +
          '</ul>' +
          '<div class="audio-acceso" id="audio">' +
            '<button type="button" class="boton bloque secundario" id="boton-audio" aria-describedby="audio-nota" aria-expanded="false" aria-controls="audio-nota">' + ICONOS.audiodescripcion + 'Escuchar ' + esc(AP.al_(a)) + '</button>' +
            '<p class="audio-nota" id="audio-nota"><span class="pendiente">Audio en producción</span> <span id="audio-detalle" hidden>En el dispositivo, este botón reproduce una versión narrada del panel y del último mensaje del árbol.</span></p>' +
          '</div>' +
          '<p class="nota acceso-nota">En el dispositivo real estos botones abren la cuenta del árbol en la aplicación.</p>' +
          '<div class="otros-arboles">' +
            '<a href="index.html#arboles">Conocer a los otros árboles de la red</a>' +
            '<ul aria-label="Otros árboles de la red">' + otros + '</ul>' +
          '</div>' +
        '</div>';

      // Audio: en la maqueta solo explica qué hará el botón en el dispositivo.
      var botonAudio = document.getElementById("boton-audio");
      botonAudio.addEventListener("click", function () {
        var detalle = document.getElementById("audio-detalle");
        detalle.hidden = !detalle.hidden;
        botonAudio.setAttribute("aria-expanded", String(!detalle.hidden));
      });

      AP.montar();

      // El contenido se genera con JS: volver al ancla #audio al cargar.
      if (location.hash === "#audio") {
        window.addEventListener("load", function () { document.getElementById("audio").scrollIntoView(); });
      }
    })();
  </script>
</body>
</html>
